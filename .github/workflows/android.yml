name: Android app
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk Bernard.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Bernard Android app (build ${{ github.run_number }})
          body: "Install Bernard.apk on your phone. Open this page on the phone and tap Bernard.apk to download."
          files: Bernard.apk
          make_latest: true
