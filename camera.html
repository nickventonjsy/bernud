<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bernard Home Screen</title>
<!-- The TV browser's home page (the address is kept from when this was the camera page, so the TV still opens it).
     Since 6 Nov it's only Bernard's home screen: clock, weather, today's diary and parcels, and the headlines. -->
<style>
  :root { --bg: #0b0506; --line: #5a1a1f; --text: #f4e9e9; --dim: #b89a9c; --red: #ff3b4a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { position: relative; height: 100%; }
  .msg { position: absolute; inset: auto 16px 16px 16px; text-align: center; color: var(--dim); font-size: 14px; }
  .pass { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; padding: 24px; }
  .pass input, .pass button { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font: inherit; }
  .hidden { display: none !important; }
  .amb { position: absolute; inset: 0; display: grid; grid-template-columns: 1.15fr 1fr; grid-template-rows: auto 1fr auto; gap: 28px 48px; padding: 48px 64px; background: radial-gradient(ellipse at top left, #2a0c10, #0b0506 60%); color: #fff; }
  .amb .clock { font-size: 150px; font-weight: 200; line-height: 1; letter-spacing: -.02em; }
  .amb .date { font-size: 34px; color: var(--dim); margin-top: 8px; }
  .amb .wx { text-align: right; align-self: start; }
  .amb .wx .t { font-size: 96px; font-weight: 200; line-height: 1; }
  .amb .wx .d { font-size: 28px; color: var(--dim); }
  .amb h3 { margin: 0 0 12px; font-size: 20px; letter-spacing: .14em; color: var(--red); font-weight: 600; }
  .amb ul { margin: 0; padding: 0; list-style: none; font-size: 28px; line-height: 1.45; }
  .amb li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amb .day { grid-column: 1 / -1; }
  .amb .news { grid-column: 1 / -1; font-size: 26px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<main>
  <form class="pass hidden" id="passForm">
    <label for="pass">Dashboard passcode</label>
    <input id="pass" type="password" autocomplete="off">
    <button type="submit">Show the home screen</button>
  </form>
  <section class="amb" id="amb" aria-label="Home screen">
    <div><div class="clock" id="ambClock"></div><div class="date" id="ambDate"></div></div>
    <div class="wx" id="ambWx"></div>
    <div class="day"><h3>TODAY</h3><ul id="ambDay"></ul></div>
    <div class="news" id="ambNews"></div>
  </section>
  <div class="msg" id="msg"></div>
</main>
<script>
  const SERVER = "https://bernud-server.onrender.com";
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const msg = (t) => { $("msg").textContent = t || ""; };
  // On the TV the home page address carries its own key (?tvk=...), so nothing has to be typed with the remote.
  const TVK = params.get("tvk") || "";
  const authHeaders = () => (TVK ? { "x-tv-key": TVK } : { "x-dashboard-key": store.get("bernud.dashKey") || "" });
  async function api(path) {
    if (!store.get("bernud.dashKey") && !TVK) { showPass(); throw new Error("passcode"); }
    const r = await fetch(SERVER + path, { headers: authHeaders() });
    if (r.status === 401) { showPass("That passcode wasn't accepted."); throw new Error("passcode"); }
    return r.json();
  }
  function showPass(note) { $("passForm").classList.remove("hidden"); $("amb").classList.add("hidden"); msg(note || "Enter Bernard's dashboard passcode once on this device."); }
  $("passForm").addEventListener("submit", (e) => { e.preventDefault(); store.set("bernud.dashKey", $("pass").value.trim()); $("passForm").classList.add("hidden"); $("amb").classList.remove("hidden"); msg(""); refresh().then(rotateNews); });

  const WX = { 0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Cloudy", 45: "Fog", 48: "Fog", 51: "Drizzle", 53: "Drizzle", 55: "Drizzle", 61: "Light rain", 63: "Rain", 65: "Heavy rain", 71: "Snow", 73: "Snow", 75: "Heavy snow", 80: "Showers", 81: "Showers", 82: "Heavy showers", 95: "Thunderstorms", 96: "Thunderstorms", 99: "Thunderstorms" };
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  function clock() {
    const d = new Date(), o = { timeZone: "Europe/London" };
    $("ambClock").textContent = d.toLocaleTimeString("en-GB", { ...o, hour: "2-digit", minute: "2-digit" });
    $("ambDate").textContent = d.toLocaleDateString("en-GB", { ...o, weekday: "long", day: "numeric", month: "long" });
  }
  let news = [], newsAt = 0;
  async function refresh() {
    try {
      const j = await api("/ambient");
      if (!j || !j.ok) return;
      const w = j.weather;
      $("ambWx").innerHTML = w ? `<div class="t">${esc(w.now)}°</div><div class="d">${esc(WX[w.code] || "")}</div><div class="d">High ${esc(w.high)}° · Low ${esc(w.low)}°${w.rain != null ? ` · Rain ${esc(w.rain)}%` : ""}</div>` : "";
      const day = [...(j.events || []).map((e) => `${esc(e.when)} · ${esc(e.title)}`), ...(j.parcels || []).map((p) => `📦 ${esc(p)}`)];
      $("ambDay").innerHTML = (day.length ? day : ["Nothing in the diary."]).slice(0, 6).map((l) => `<li>${l}</li>`).join("");
      news = j.news || [];
    } catch {}
  }
  function rotateNews() { if (news.length) $("ambNews").textContent = news[newsAt++ % news.length]; }
  clock(); refresh().then(rotateNews);
  let n = 0;
  setInterval(() => { clock(); if (++n % 8 === 0) rotateNews(); if (n % 60 === 0) refresh(); }, 1000);
</script>
</body>
</html>
